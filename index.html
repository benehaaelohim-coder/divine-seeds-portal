<style>

body.student{--bg:#0e1a2e;--card:#16253d;--tx:#eef2fa;--mut:#9fb0cc;--bd:#243656;--side:#0a1424;--pri:#e8c77a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
#loginBox{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#10213f,#1c3f94 60%,#e0147a);padding:16px}

button{background:var(--pri);color:#fff;border:0;cursor:pointer;font-weight:600;width:auto}body.student button{color:#10213f}
button.s{background:var(--acc);color:#fff}button.g{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.pw{position:relative}.pw input{padding-right:44px}.pw span{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;user-select:none;font-size:18px}

#appBox{display:none;grid-template-columns:240px 1fr;min-height:100vh}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
.stat b{font-size:24px;display:block}.stat span{color:var(--mut);font-size:13px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.pic{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);background:#ccd}

.red{color:var(--bad);font-weight:700}.green{color:var(--ok);font-weight:700}.tag{padding:3px 10px;border-radius:20px;font-size:12px;color:#fff}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{margin:0}
#menu{display:none}
/* ---- Student dashboard ---- */
.sd{display:grid;grid-template-columns:270px minmax(0,1fr) 310px;gap:16px;align-items:start}
.sd>.card{margin:0}.mut{color:var(--mut);margin:2px 0;font-size:13px}
.sdp{text-align:center;padding:26px 18px}
.sdp .ph{width:170px;height:170px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 0 7px rgba(245,183,0,.16),0 12px 30px rgba(0,0,0,.28);background:var(--bd)}

.fb{margin-top:14px;text-align:left}.fb small{color:var(--mut)}
.bar{height:6px;border-radius:6px;background:var(--bd);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.sdtabs{display:flex;gap:24px;border-bottom:1px solid var(--bd);margin-bottom:6px;overflow-x:auto}

.rc .card{margin-bottom:16px}.rc h5{margin:12px 0 8px;font-size:12px;color:var(--mut);font-weight:600}.rc h5:first-of-type{margin-top:0}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border-left:3px solid var(--k);margin-bottom:7px;font-size:14px}
.ev small{display:block;color:var(--mut)}.ev .dt{font-size:12px;color:var(--mut);white-space:nowrap}
.sj{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;background:var(--bg);border-left:3px solid var(--gold);margin-bottom:7px;font-size:14px}
@media(max-width:1100px){.sd{grid-template-columns:260px minmax(0,1fr)}.sd .rc{grid-column:1/-1}}
@media(max-width:800px){.sd{grid-template-columns:1fr}.sdm{padding:14px}}
@media(max-width:800px){#appBox{grid-template-columns:1fr}aside{position:fixed;left:-260px;width:240px;z-index:9;transition:.2s}aside.open{left:0}#menu{display:inline-block}}
</style></head><body>
<div id="loginBox"><div class="lbox"><img src="" id="lg" alt="Divine Seeds International Schools logo" onerror="this.style.display='none'"><h2>DIVINE SEEDS INTERNATIONAL EKET</h2><small>Training Godly Future Champions</small><br><br>

<script>
const LOGO_URL="./logo.png"; // logo.png must sit in the same folder as this page (GitHub Pages)
const CFG={apiKey:"AIzaSyDLryqwFI885uE0xQzSUN2Qo0MZZoDxVm0",authDomain:"divine-seeds-portal.firebaseapp.com",projectId:"divine-seeds-portal",storageBucket:"divine-seeds-portal.firebasestorage.app",messagingSenderId:"151651524541",appId:"1:151651524541:web:cd28e4cefe26d72f6a7cd4"};
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore();
const $=s=>document.querySelector(s),v=id=>{const e=document.getElementById(id);return e?e.value:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₦'+Number(n||0).toLocaleString(),today=()=>new Date().toISOString().slice(0,10);
const FAKE='@divineseeds.app',TOP=['proprietor','admin'],MG=['proprietor','admin','principal'];
// ---- School settings (EDIT THESE) ----
const SCHOOL={email:'info@divineseeds.edu.ng',phone:'+234 800 000 0000',loc:{'Ediam':'Ediam, Eket, Akwa Ibom','Ikot Oso':'Ikot Oso, Eket, Akwa Ibom'}};
const CLASSES=['Creche','Nursery 1','Nursery 2','Nursery 3','Primary 1','Primary 2','Primary 3','Primary 4','Primary 5','Primary 6','JSS1','JSS2','JSS3','SS1','SS2','SS3'];
const TRIS=['1st Trimester','2nd Trimester','3rd Trimester'];
const grade=n=>n>=70?'A':n>=60?'B':n>=50?'C':n>=40?'D':'F';
const subId=(c,n)=>(c+'_'+n).replace(/[\/\s]+/g,'_').toLowerCase();
let me,photo='',FEE={st:[],paid:{},fs:[],owing:[]},TEACH=[],SD={};
const loginBox=$('#loginBox'),appBox=$('#appBox'),side=$('#side'),err=$('#err'),info=$('#info'),ttl=$('#ttl'),mainEl=$('#main');
$('#lg').src=LOGO_URL;
function togglePw(){const i=$('#p'),s=i.type=='password';i.type=s?'text':'password';$('#eye').textContent=s?'🙈':'👁️'}
// Apps Script runs pages in a sandboxed iframe, so fall back if browser storage is blocked
const P=firebase.auth.Auth.Persistence;const ready=(async()=>{for(const m of [P.LOCAL,P.SESSION,P.NONE]){try{await auth.setPersistence(m);return}catch(e){}}})();

const MENU={student:['dash:Dashboard','news:Announcements','acct:My Account'],
teacher:['dash:My Dashboard','comp:Compute Results','roll:Class Attendance','attend:Attendance','news:Announcements','acct:My Account'],
staff:['dash:My Dashboard','attend:Attendance','news:Announcements','acct:My Account'],
accountant:['fees:Fees & Payments','dash:My Dashboard','attend:Attendance','news:Announcements','acct:My Account'],
confectionery:['dash:My Dashboard','bread:Confectionery','attend:Attendance','news:Announcements','acct:My Account'],
principal:['mgmt:Overview','reg:Registration','fees:Fees & Payments','setup:Classes & Teachers','subj:Subjects Template','comp:Compute Results','pub:Validate Results','events:Events Calendar','news:Post Announcement','roll:Take Attendance','attend:Attendance','bread:Confectionery','notes:Notifications','acct:My Account']};
MENU.proprietor=MENU.admin=[...MENU.principal,'staffreg:Staff & Roles','stat:Stationery','reset:Reset'];

let unlocked=false;
const bioKey=uid=>'dsbio_'+uid,bioGet=uid=>{try{return localStorage.getItem(bioKey(uid))}catch(e){return null}},
 bioSet=(uid,val)=>{try{val?localStorage.setItem(bioKey(uid),val):localStorage.removeItem(bioKey(uid))}catch(e){}},
 bioOK=()=>!!(window.PublicKeyCredential&&navigator.credentials),
 b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
auth.onAuthStateChanged(async user=>{
  if(!user){unlocked=false;loginBox.style.display='grid';appBox.style.display='none';return}
  if(bioGet(user.uid)&&!unlocked){showLock();return}
  unlocked=true;await enter(user);
});
async function enter(user){
  try{
    const d=await db.doc('users/'+user.uid).get();
    if(!d.exists){err.textContent='Signed in, but no role profile was found. In Firestore, create users/'+user.uid+' with role and name fields.';await auth.signOut();return}
    me={uid:user.uid,...d.data()};
    if(!me.role){err.textContent='Your Firestore users profile is missing the role field.';await auth.signOut();return}
    lbReset();loginBox.style.display='none';appBox.style.display='grid';
    document.body.className=me.role==='student'?'student':'';
    $('#bell').style.display=MG.includes(me.role)?'inline':'none';
    $('#lockBtn').style.display=bioGet(user.uid)?'inline':'none';
    const m=MENU[me.role]||MENU.staff;
    side.innerHTML=`<img src="${esc(LOGO_URL)}" alt="Divine Seeds logo" onerror="this.style.display='none'"><h4>DIVINE SEEDS</h4>`+m.map(i=>{const[k,l]=i.split(':');return`<a data-k="${k}" onclick="go('${k}')">${l}</a>`}).join('');
    go(m[0].split(':')[0]);
  }catch(e){console.error('Profile load failed:',e.code,e.message);err.textContent='Signed in, but could not read your Firestore profile. Check Firestore rules and the users document.';await auth.signOut()}
}

// ---------- Login, recovery ----------
async function resolveEmail(x){
  x=x.trim().toLowerCase();
  if(x.includes('@'))return x;
  try{const c=localStorage.getItem('dsu_'+x);if(c)return c}catch(e){}
  try{const d=await db.doc('usernames/'+x).get();if(d.exists&&d.data().email){try{localStorage.setItem('dsu_'+x,d.data().email)}catch(e){}return d.data().email}}catch(e){console.warn('username lookup failed',e.code)}
  return x+FAKE; // older accounts
}
function lbReset(){const b=$('#lb');b.disabled=false;b.textContent='Sign in'}
async function login(){
  err.textContent='';info.textContent='';
  const pw=v('p');
  if(!v('u').trim()||!pw){err.textContent='Enter your username and password.';return}
  const lb=$('#lb');lb.disabled=true;lb.textContent='Signing in...';
  await ready;
  const email=await resolveEmail(v('u'));
  unlocked=true;
  try{await auth.signInWithEmailAndPassword(email,pw)}catch(e){
    unlocked=false;lbReset();
    if(e.code=='auth/user-not-found'||e.code=='auth/invalid-email'){try{localStorage.removeItem('dsu_'+v('u').trim().toLowerCase())}catch(_){}}
    console.error('Sign-in failed:',e.code,e.message);
    const M={'auth/invalid-email':'The username/email format is invalid.','auth/invalid-credential':'The username or password is incorrect. Use "Forgot password?" to reset it.','auth/wrong-password':'The password is incorrect. Use "Forgot password?" to reset it.','auth/user-not-found':'No account matches this username.','auth/too-many-requests':'Too many attempts. Wait a while, or reset your password.','auth/operation-not-allowed':'Email/password sign-in is disabled in Firebase Authentication.','auth/network-request-failed':'Network error. Check your internet connection.','auth/unauthorized-domain':'This site domain is not authorized in Firebase Authentication → Settings → Authorized domains.'};
    err.textContent=M[e.code]||('Login failed: '+(e.code||'unknown error'));
  }
}
async function forgot(){
  err.textContent='';info.textContent='';
  if(!v('u').trim()){err.textContent='Type your username (or email) above first, then tap Forgot password.';return}
  const email=await resolveEmail(v('u'));
  if(email.endsWith(FAKE)){err.textContent='No recovery email is saved for this account. Please contact the school office.';return}
  try{await auth.sendPasswordResetEmail(email)}catch(e){if(e.code!=='auth/user-not-found'){err.textContent='Could not send reset email: '+e.code;return}}
  info.textContent='If this account has a recovery email, a reset link has been sent. Check your inbox and spam folder.';
}
function showLock(){appBox.style.display='none';loginBox.style.display='grid';err.textContent='';info.textContent='Locked. Tap "Sign in with Fingerprint" to continue.'}
function lock(){unlocked=false;showLock()}
async function bio(){
 err.textContent='';info.textContent='';
 if(!bioOK()){err.textContent='This browser/device does not support fingerprint sign-in. Use your password.';return}
 const u=auth.currentUser;
 if(!u||!bioGet(u.uid)){err.textContent='Fingerprint is not ready on this device. Sign in with your password, enable fingerprint in My Account, then use the Lock button (not Logout) when you leave.';return}
 try{await verifyBio(u.uid);unlocked=true;await enter(u)}catch(e){console.warn(e);err.textContent='Fingerprint not recognised or cancelled. Try again or use your password.'}}
async function verifyBio(uid){
 const id=bioGet(uid);if(!id)throw new Error('not enrolled');
 await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(id),transports:['internal']}],userVerification:'required',timeout:60000}})}
async function enableBio(){
 const m=$('#bmsg');m.className='red';
 if(!bioOK()){m.textContent='This browser/device does not support fingerprint sign-in.';return}
 try{
  if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())){m.textContent='No fingerprint or screen-lock biometric is set up on this device.';return}
  const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Divine Seeds Portal'},user:{id:new TextEncoder().encode(me.uid),name:me.username||me.name,displayName:me.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  bioSet(me.uid,b64(c.rawId));$('#lockBtn').style.display='inline';V.acct();
 }catch(e){m.textContent='Could not enable fingerprint ('+(e.name||e.message)+'). If the portal is opened inside Apps Script, the browser may block it; use the GitHub Pages link.'}}
function disableBio(){bioSet(me.uid,null);$('#lockBtn').style.display='none';V.acct()}

// ---------- Helpers ----------
const add=(c,o)=>db.collection(c).add({...o,by:me.uid,byName:me.name,at:Date.now()});
const list=async(c,...f)=>{let q=db.collection(c);f.forEach(x=>q=q.where(...x));return(await q.get()).docs.map(d=>({id:d.id,...d.data()}))};
const notify=m=>add('notifications',{msg:m,to:MG});
const set=h=>mainEl.innerHTML=h;
const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
function go(k){document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));side.classList.remove('open');
 const a=document.querySelector(`aside a[data-k="${k}"]`);ttl.textContent=a?a.textContent:'';mainEl.innerHTML='<div class="card">Loading...</div>';Promise.resolve(V[k]()).then(fillBio)}
function F(a){return a.map(([k,l,o])=>o&&o!='date'&&o!='number'&&o!='email'?`<select id="f_${k}"><option value="">${l}</option>${o.split(',').map(x=>`<option>${x}</option>`).join('')}</select>`:`<input id="f_${k}" type="${o||'text'}" placeholder="${l}">`).join('')}
const G=()=>Object.fromEntries([...document.querySelectorAll('[id^=f_]')].map(e=>[e.id.slice(2),e.value.trim()]));
function snap(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d');x.filter='brightness(1.08) contrast(1.05) saturate(1.1)';const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,240,240);photo=c.toDataURL('image/jpeg',.8);$('#pv').src=photo};im.src=URL.createObjectURL(f)}

// ---------- Views ----------
const V={
async dash(){
 if(me.role=='student')return studentDash(me.uid);
 const s=(await db.doc('staff/'+me.uid).get()).data()||{};
 const at=await list('attendance',['uid','==',me.uid]),ab=at.filter(a=>a.status=='Absent').length;
 set(`<div class="card hero"><img class="pic" src="${esc(s.photo||'')}"><div><h2>${esc(me.name)}</h2><p>${esc(s.position||me.role)} · ${esc(s.department||'')}<br>ID: ${esc(s.staffId||'')} · ${esc(s.campus||'')}</p></div></div>
 <div class="grid"><div class="card stat"><span>Basic Salary</span><b>${money(s.salary)}</b></div><div class="card stat"><span>Fines (₦1,000/absence)</span><b class="red">${money(ab*1000)}</b></div><div class="card stat"><span>Net Pay</span><b class="green">${money((s.salary||0)-ab*1000)}</b></div><div class="card stat"><span>Days Present</span><b>${at.length-ab}</b></div></div>
 <div class="card"><h3>Attendance Record</h3><table><tr><th>Date</th><th>Time</th><th>Status</th></tr>${at.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.time||'-')}</td><td class="${a.status=='Present'?'green':'red'}">${esc(a.status)}</td></tr>`).join('')}</table></div>`)},

 const mg=MG.includes(me.role),a=(await list('announcements',...(mg?[]:[['audience','==',me.role=='student'?'students':'staff']]))).sort((x,y)=>y.at-x.at);
 set((mg?`<div class="card"><h3>Post Announcement</h3><select id="aud"><option value="students">Students</option><option value="staff">Teachers & Staff</option></select><input id="ann_t" placeholder="Title"><textarea id="ann_b" placeholder="Message"></textarea><button onclick="postNews()">Publish</button></div>`:'')+
 (a.map(x=>`<div class="card"><b>${esc(x.title)}</b> <span class="tag" style="background:var(--acc)">${esc(x.audience)}</span><p>${esc(x.body)}</p><small>${esc(x.byName)} · ${new Date(x.at).toLocaleString()}</small></div>`).join('')||'<div class="card">No announcements yet.</div>'))},
async attend(){
 const ex=await db.doc('attendance/'+today()+'_'+me.uid).get();
 set(`<div class="card"><h3>Working-hours Attendance (Staff)</h3><p>Clock in before <b>08:00</b> to be Present. Later or no clock-in = Absent and a ₦1,000 fine.</p>
 ${ex.exists?`<p class="green">Recorded: ${esc(ex.data().status)} at ${esc(ex.data().time)}</p>`:`<button onclick="clock()">👆 Fingerprint Clock-In</button>${bioGet(me.uid)?'':'<p><small>Tip: enable fingerprint in My Account to require a fingerprint check here.</small></p>'}`}</div>`)},
async pub(){
 const r=await list('results',['published','==',false]);
 set(`<div class="card"><h3>Results awaiting validation</h3><table><tr><th>Student</th><th>Class</th><th>Subject</th><th>Trimester</th><th>Total</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.studentName)}</td><td>${esc(x.class||'')}</td><td>${esc(x.subject)}</td><td>${esc(x.trimester)}</td><td>${x.test+x.exam}</td><td><button onclick="publish('${x.id}')">Validate</button></td></tr>`).join('')||'<tr><td>Nothing waiting.</td></tr>'}</table>${r.length?'<button class="s" onclick="publishAll()">Validate all</button>':''}</div>`)},

async function mkUser(username,pw,data,realEmail){
 username=username.toLowerCase();
 const real=(realEmail||'').trim().toLowerCase();
 const sec=firebase.apps.find(a=>a.name=='sec')||firebase.initializeApp(CFG,'sec');
 let email=real||(username+FAKE),c;
 try{c=await sec.auth().createUserWithEmailAndPassword(email,pw)}
 catch(e){
  // Firebase allows one account per email. If this parent email is already used, create a
  // unique alias (name+username@domain) that still delivers to the same inbox.
  if(e.code=='auth/email-already-in-use'&&real.includes('@')){
   const i=real.lastIndexOf('@');email=real.slice(0,i).split('+')[0]+'+'+username+real.slice(i);
   c=await sec.auth().createUserWithEmailAndPassword(email,pw);
  }else throw e}
 if(real){try{await sec.auth().sendPasswordResetEmail(email)}catch(e){console.warn(e.code)}}
 await sec.auth().signOut();
 await db.doc('users/'+c.user.uid).set({...data,email,username});
 await db.doc('usernames/'+username).set({email});
 mkUser.last=email;
 return c.user.uid}

const RESETS=['announcements','results','attendance','fees','bread_days','notifications','events','comments','stationery','classes','subjects','biometrics'];
async function doReset(){
 const c=v('rc'),cols=c=='all'?RESETS:[c],m=$('#rst_msg');
 if(c=='all'){if(prompt('This deletes ALL of these records:\n'+RESETS.join(', ')+'\n\nStudent, staff and login accounts are kept.\nType RESET to confirm.')!=='RESET')return}
 else if(!confirm('Delete ALL records in '+c+'?'))return;
 m.className='';m.textContent='Resetting...';
 try{
  for(const col of cols){
   const docs=(await db.collection(col).get()).docs;
   for(let i=0;i<docs.length;i+=400){const b=db.batch();docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
  }
  if(cols.includes('biometrics')){
   for(const col of ['students','staff']){
    const docs=(await db.collection(col).where('fpEnrolled','==',true).get()).docs;
    for(let i=0;i<docs.length;i+=400){const b=db.batch();docs.slice(i,i+400).forEach(d=>b.update(d.ref,{fpEnrolled:false}));await b.commit()}
   }
  }
  m.className='green';m.textContent='Reset done: '+cols.join(', ')+'.';
 }catch(e){m.className='red';m.textContent='Could not finish: '+(e.code||e.message)+'. Check that your Firestore rules allow admins to delete these collections.'}}
// ---- Futronic scanner via the local "Biometric Web API" service (webapi.exe on http://localhost:8080) ----
const FPURL='http://localhost:8080';let FP={t:[]};
const FPUI=`<p><b>Fingerprint</b> <small>(optional now; can be enrolled later in Take Attendance. Get written consent from the parent or staff member first.)</small></p><button type="button" onclick="fpCapture(0)">👆 Scan finger 1</button> <button type="button" onclick="fpCapture(1)">👆 Scan finger 2</button><br><img id="fp_img0" style="display:none;width:90px;margin:6px"><img id="fp_img1" style="display:none;width:90px;margin:6px"><p id="fp_msg"></p>`;
const fpErr=e=>e instanceof TypeError?'Cannot reach the fingerprint service. Plug in the scanner, start webapi.exe on this computer, and use Chrome or Edge.':(e.message||'Scan failed');
async function fpScan(){const j=await(await fetch(FPURL+'/api/scan/single')).json();if(!j.success)throw new Error(j.message||'Scan failed. Place the finger firmly and try again.');return j}
async function fpCapture(n){
 const m=$('#fp_msg');m.className='';m.textContent='Place finger '+(n+1)+' on the scanner...';
 try{const j=await fpScan();FP.t[n]=j.templateBase64;const im=$('#fp_img'+n);im.src=j.imageBase64;im.style.display='inline-block';m.className='green';m.textContent='Finger '+(n+1)+' captured.'}
 catch(e){m.className='red';m.textContent=fpErr(e)}}
async function fpSave(uid,kind){const t=FP.t.filter(Boolean);if(!t.length)return;await db.doc('biometrics/'+uid).set({kind,templates:t,at:Date.now(),by:me.uid})}
async function fpVerify(uid){
 const b=await db.doc('biometrics/'+uid).get();if(!b.exists)throw new Error('No fingerprint enrolled for this person.');
 const body=new URLSearchParams();b.data().templates.forEach((t,i)=>body.append('template'+(i+1),t));
 const j=await(await fetch(FPURL+'/verify_with_template',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body})).json();
 if(!j.success)throw new Error(j.message||'Verification failed');return !!j.verified}
async function enrolFP(uid){
 const p=ROLL.ppl.find(x=>x.id===uid),m=$('#r_msg');FP={t:[]};
 try{
  m.className='';m.textContent=p.name+': place finger 1 on the scanner...';FP.t[0]=(await fpScan()).templateBase64;
  m.textContent='Lift the finger. Now place finger 2 (or the same finger again)...';await new Promise(r=>setTimeout(r,1500));FP.t[1]=(await fpScan()).templateBase64;
  await fpSave(uid,ROLL.kind);await db.doc((ROLL.kind=='staff'?'staff/':'students/')+uid).update({fpEnrolled:true});
  p.fp=true;m.className='green';m.textContent='Fingerprint enrolled for '+p.name+'.';drawRoll();
 }catch(e){m.className='red';m.textContent=fpErr(e)}}
async function fpCheckMark(uid){
 const p=ROLL.ppl.find(x=>x.id===uid),m=$('#r_msg'),r0=ROLL.rec[uid];
 if(r0&&r0.status!='Absent'){m.className='red';m.textContent=p.name+' is already marked '+r0.status+' at '+r0.time+'.';return}
 m.className='';m.textContent=p.name+': place finger on the scanner...';
 try{
