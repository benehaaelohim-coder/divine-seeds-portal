<div id="loginBox"><div class="lbox"><img src="" id="lg" alt="Divine Seeds International Schools logo" onerror="this.style.display='none'"><h2>DIVINE SEEDS INTERNATIONAL EKET</h2><small>Training Godly Future Champions</small><br><br>

<script>

const CLASSES=['Creche','Nursery 1','Nursery 2','Nursery 3','Primary 1','Primary 2','Primary 3','Primary 4','Primary 5','Primary 6','JSS1','JSS2','JSS3','SS1','SS2','SS3'];
const TRIS=['1st Trimester','2nd Trimester','3rd Trimester'];

let me,photo='',FEE={st:[],paid:{},fs:[],owing:[]},TEACH=[],SD={},STF={},FIN={fs:[],ex:[],ses:[]};

MENU.proprietor=MENU.admin=[...MENU.principal,'staffreg:Staff & Roles','stat:Stationery','reset:Reset'];
// Chairman and School Administrator: everything except Reset
MENU.chairman=MENU.administrator=[...MENU.principal,'staffreg:Staff & Roles','stat:Stationery'];

let unlocked=false;
const bioKey=uid=>'dsbio_'+uid,
 ckGet=k=>{const m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));return m?decodeURIComponent(m[1]):null},
 ckSet=(k,x)=>{document.cookie=k+'='+(x?encodeURIComponent(x)+';max-age=31536000':';max-age=0')+';path=/;SameSite=Lax'},
 bioGet=uid=>{let r=null;try{r=localStorage.getItem(bioKey(uid))}catch(e){}return r||ckGet(bioKey(uid))},

 bioOK=()=>!!(window.PublicKeyCredential&&navigator.credentials),

auth.onAuthStateChanged(async user=>{
  if(!user){unlocked=false;loginBox.style.display='grid';appBox.style.display='none';return}
  if(bioGet(user.uid)&&!unlocked){showLock();return}
  unlocked=true;await enter(user);
});
async function enter(user){
  try{
    const d=await db.doc('users/'+user.uid).get();
    if(!d.exists){err.textContent='Signed in, but no role profile was found. In Firestore, create users/'+user.uid+' with role and name fields.';await auth.signOut();return}
    me={uid:user.uid,...d.data()};
    if(!me.role){err.textContent='Your Firestore users profile is missing the role field.';await auth.signOut();return}
    lbReset();loginBox.style.display='none';appBox.style.display='grid';
    document.body.className=me.role==='student'?'student':'';
    $('#bell').style.display=MG.includes(me.role)?'inline':'none';
    $('#lockBtn').style.display=bioGet(user.uid)?'inline':'none';
    const m=MENU[me.role]||MENU.staff;
    side.innerHTML=`<img src="${esc(LOGO_URL)}" alt="Divine Seeds logo" onerror="this.style.display='none'"><h4>DIVINE SEEDS</h4>`+m.map(i=>{const[k,l]=i.split(':');return`<a data-k="${k}" onclick="go('${k}')">${l}</a>`}).join('');
    go(m[0].split(':')[0]);
  }catch(e){console.error('Profile load failed:',e.code,e.message);err.textContent='Signed in, but could not read your Firestore profile. Check Firestore rules and the users document.';await auth.signOut()}
}

// ---------- Login, recovery ----------
async function resolveEmail(x){
  x=x.trim().toLowerCase();
  if(x.includes('@'))return x;
  try{const c=localStorage.getItem('dsu_'+x);if(c)return c}catch(e){}
  try{const d=await db.doc('usernames/'+x).get();if(d.exists&&d.data().email){try{localStorage.setItem('dsu_'+x,d.data().email)}catch(e){}return d.data().email}}catch(e){console.warn('username lookup failed',e.code)}
  return x+FAKE; // older accounts
}
function lbReset(){const b=$('#lb');b.disabled=false;b.textContent='Sign in'}
async function login(){
  err.textContent='';info.textContent='';
  const pw=v('p');
  if(!v('u').trim()||!pw){err.textContent='Enter your username and password.';return}
  const lb=$('#lb');lb.disabled=true;lb.textContent='Signing in...';
  await ready;
  const email=await resolveEmail(v('u'));
  unlocked=true;
  try{await auth.signInWithEmailAndPassword(email,pw)}catch(e){
    unlocked=false;lbReset();
    if(e.code=='auth/user-not-found'||e.code=='auth/invalid-email'){try{localStorage.removeItem('dsu_'+v('u').trim().toLowerCase())}catch(_){}}
    console.error('Sign-in failed:',e.code,e.message);
    const M={'auth/invalid-email':'The username/email format is invalid.','auth/invalid-credential':'The username or password is incorrect. If several people share one email, sign in with your USERNAME. Use "Forgot password?" to reset it.','auth/wrong-password':'The password is incorrect. Use "Forgot password?" to reset it.','auth/user-not-found':'No account matches this username.','auth/too-many-requests':'Too many attempts. Wait a while, or reset your password.','auth/operation-not-allowed':'Email/password sign-in is disabled in Firebase Authentication.','auth/network-request-failed':'Network error. Check your internet connection.','auth/unauthorized-domain':'This site domain is not authorized in Firebase Authentication → Settings → Authorized domains.'};
    err.textContent=M[e.code]||('Login failed: '+(e.code||'unknown error'));
  }
}
// Password reset. Works with a username (sends to that account's recovery address) or with a SHARED email
// (sends one reset link per account that uses that email; each link shows the username inside the address).
async function forgot(){
  err.textContent='';info.textContent='';
  const x=v('u').trim().toLowerCase();
  if(!x){err.textContent='Type your username (or email) above first, then tap Forgot password.';return}
  let targets=[];
  if(x.includes('@')){
    try{const q=await db.collection('usernames').where('real','==',x).get();targets=q.docs.map(d=>d.data().email)}catch(e){console.warn('shared-email lookup',e.code)}
    targets.push(x);
  }else{
    const email=await resolveEmail(x);
    if(email.endsWith(FAKE)){err.textContent='No recovery email is saved for this account. Please contact the school office.';return}
    targets=[email];
  }
  targets=[...new Set(targets.filter(Boolean))];
  for(const t of targets){
    try{await auth.sendPasswordResetEmail(t)}catch(e){if(e.code!=='auth/user-not-found'&&e.code!=='auth/invalid-email'){err.textContent='Could not send reset email: '+e.code;return}}
  }
  info.textContent=targets.length>1?'Reset links have been sent for each account that uses this email. Check your inbox and spam folder; the address in each message contains the username it belongs to.':'If this account has a recovery email, a reset link has been sent. Check your inbox and spam folder.';
}

 err.textContent='';info.textContent='';
 if(!bioOK()){err.textContent='This browser/device does not support fingerprint sign-in. Use your password.';return}
 const u=auth.currentUser;
 if(!u||!bioGet(u.uid)){err.textContent='Fingerprint is not ready on this device. Sign in with your password, enable fingerprint in My Account, then use the Lock button (not Logout) when you leave.';return}
 try{await verifyBio(u.uid);unlocked=true;await enter(u)}catch(e){console.warn(e);err.textContent='Fingerprint not recognised or cancelled. Try again or use your password.'}}
async function verifyBio(uid){
 const id=bioGet(uid);if(!id)throw new Error('not enrolled');
 await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(id),transports:['internal']}],userVerification:'required',timeout:60000}})}
async function enableBio(){
 const m=$('#bmsg');m.className='red';
 if(!bioOK()){m.textContent='This browser/device does not support fingerprint sign-in.';return}
 try{
  if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())){m.textContent='No fingerprint or screen-lock biometric is set up on this device.';return}
  const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Divine Seeds Portal'},user:{id:new TextEncoder().encode(me.uid),name:me.username||me.name,displayName:me.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  bioSet(me.uid,b64(c.rawId));$('#lockBtn').style.display='inline';V.acct();
 }catch(e){m.textContent='Could not enable fingerprint ('+(e.name||e.message)+'). If the portal is opened inside Apps Script, the browser may block it; use the GitHub Pages link.'}}
function disableBio(){bioSet(me.uid,null);$('#lockBtn').style.display='none';V.acct()}

 if(!MG.includes(me.role))return alert('Only management can download financial records.');
 try{
  const[fs,ex]=await Promise.all([list('fees'),list('expenses')]),inR=d=>(!a||d>=a)&&(!b||d<=b),R=[];
  if(k!=='out')fs.forEach(x=>{const d=ld(x.at);if(inR(d))R.push({d,t:'Income',ref:x.receiptNo||'',n:(x.studentName||'')+(x.regNo?' ('+x.regNo+')':''),c:x.type||'',tri:x.trimester||'',m:x.method||'',i:+x.amount||0,o:0,by:x.byName||''})});
  if(k!=='in')ex.forEach(x=>{const d=x.date||ld(x.at);if(inR(d))R.push({d,t:'Expense',ref:'',n:x.description||'',c:x.category||'',tri:x.trimester||'',m:'',i:0,o:+x.amount||0,by:x.byName||''})});
  if(!R.length)return alert('No transactions found for that period.');
  R.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
  const TI=R.reduce((s,r)=>s+r.i,0),TO=R.reduce((s,r)=>s+r.o,0);
  saveCSV(`DSIS_financial_${a||'start'}_to_${b||'latest'}.csv`,[
   ['Divine Seeds International Eket - Financial transactions'],['Period',(a||'beginning')+' to '+(b||'latest')],['Downloaded by',me.name],[],
   ['Date','Type','Receipt / Ref','Student / Description','Category','Trimester','Method','Income (NGN)','Expense (NGN)','Recorded by'],
   ...R.map(r=>[r.d,r.t,r.ref,r.n,r.c,r.tri,r.m,r.i||'',r.o||'',r.by]),[],
   ['','','','','','','TOTAL',TI,TO],['','','','','','','BALANCE',TI-TO]]);
 }catch(e){alert('Could not download: '+(e.code||e.message))}}

// Reads everything needed FIRST (closing lock, TXN counter, stock + daily record per product), writes later via cfFlush.
async function cfPre(t,pids){
 const ymd=today(),cl=await t.get(cfc('closings').doc(ymd));
 if(cl.exists&&CF.role!='admin')throw new Error('Today ('+ymd+') is already closed. Only an administrator can post to a closed day.');
 const ct=await t.get(cfc('counters').doc(ymd)),S={};let n=ct.exists?CFN(ct.data().n):0;
 for(const p of pids){const sk=await t.get(cfc('stock').doc(p)),dk=await t.get(cfc('days').doc(ymd+'_'+p)),pr=CF.P.find(x=>x.id==p),q=sk.exists?CFN(sk.data().qty):0;
  S[p]={qty:q,avg:sk.exists?CFN(sk.data().avgCost):0,name:pr?pr.name:p,cost:pr?CFN(pr.cost):0,day:dk.exists?dk.data():{ymd,pid:p,name:pr?pr.name:p,open:q,produced:0,sold:0,wasted:0,adj:0,revenue:0}}}
 // Opening inventory = yesterday's closing, because the stock balance carries over automatically
 return{ymd,S,next:()=>'TXN-'+ymd.replace(/-/g,'')+'-'+String(++n).padStart(4,'0'),cnt:()=>n}}
function cfFlush(t,P){
 for(const p in P.S){const s=P.S[p];if(s.qty<0)throw new Error('Not enough '+s.name+' in stock (would go negative).');s.day.close=s.qty;
  t.set(cfc('stock').doc(p),{qty:s.qty,avgCost:cfR2(s.avg),name:s.name,updatedAt:Date.now(),updatedBy:me.uid,by:me.uid},{merge:true});
  t.set(cfc('days').doc(P.ymd+'_'+p),{...s.day,updatedAt:Date.now(),updatedBy:me.uid,by:me.uid})}
 t.set(cfc('counters').doc(P.ymd),{n:P.cnt(),updatedAt:Date.now(),by:me.uid})}

async function cfPL(a,b){
 const[s,e,w,p,py]=await Promise.all([cfL('sales',['ymd','>=',a],['ymd','<=',b]),cfL('expenses',['ymd','>=',a],['ymd','<=',b]),cfL('wastage',['ymd','>=',a],['ymd','<=',b]),cfL('purchases',['ymd','>=',a],['ymd','<=',b]),cfL('payments',['ymd','>=',a],['ymd','<=',b])]);
 const ok=s.filter(x=>x.status=='ok'),ex=e.filter(x=>x.status=='Approved'),rev=cfSum(ok,x=>x.total),cg=cfSum(ok,x=>x.cogs),wc=cfSum(w,x=>x.cost),eo=cfSum(ex,x=>x.amount),cat={};
 ex.forEach(x=>cat[x.category]=(cat[x.category]||0)+CFN(x.amount));
 return{ok,ex,rev,cg,wc,eo,cat,gross:rev-cg,net:rev-cg-wc-eo,buy:cfSum(p,x=>x.total),cash:cfSum(ok,x=>x.paid)+cfSum(py,x=>x.amount),credit:cfSum(ok,x=>x.balance)}}
CFT.pl=async function(){
 const[a,b]=cfRng(),r=await cfPL(a,b),ds=[];for(let t=new Date(a+'T12:00:00');ld(t)<=b&&ds.length<62;t.setDate(t.getDate()+1))ds.push(ld(t));
 cfBody(`<div class="card"><h3>Profit & Loss</h3>${cfRangeUI()}<p class="mut">${a} to ${b}</p>
 <table><tr><td>Total Sales (Revenue)</td><td><b>${money(r.rev)}</b></td></tr><tr><td>Cost of goods sold (production / material cost of items sold)</td><td>${money(r.cg)}</td></tr><tr><td><b>Gross profit</b></td><td><b>${money(r.gross)}</b></td></tr><tr><td>Wastage cost</td><td>${money(r.wc)}</td></tr>${Object.entries(r.cat).map(([k,x])=>`<tr><td>Expense: ${esc(k)}</td><td>${money(x)}</td></tr>`).join('')}<tr><td>Total operating expenses</td><td>${money(r.eo)}</td></tr><tr><td><b>NET PROFIT</b></td><td><b class="${r.net<0?'red':'green'}">${money(r.net)}</b></td></tr></table>
 <p class="mut">Net profit = Revenue − Cost of goods sold − Wastage − Approved expenses. Raw-material purchases (${money(r.buy)} in this period) are NOT subtracted again, because their cost flows through Cost of goods sold. Cash received (sales + customer payments): ${money(r.cash)} · Credit given: ${money(r.credit)}.</p></div>`+(ds.length>1?cfBars('Revenue per day',ds.map(d=>d.slice(5)),ds.map(d=>cfSum(r.ok.filter(x=>x.ymd==d),x=>x.total)))+cfBars('Profit per day',ds.map(d=>d.slice(5)),ds.map(d=>cfSum(r.ok.filter(x=>x.ymd==d),x=>x.total-x.cogs)-cfSum(r.ex.filter(x=>x.ymd==d),x=>x.amount))):''))};
CFT.rep=async function(){
 const k=CF.repk||'prod',kinds=[['prod','Production Report'],['sales','Sales Report'],['inv','Inventory Report'],['mat','Raw Material Report']].concat(['admin','finance'].includes(CF.role)?[['exp','Expense Report'],['fin','Financial Report']]:[]);
 cfBody(`<div class="card"><h3>Reports</h3><div class="row">${kinds.map(([x,l])=>`<button class="${x==k?'':'g'}" onclick="CF.repk='${x}';cfDraw()">${l}</button>`).join('')}</div><div style="margin-top:10px">${cfRangeUI()}</div><div id="cfrep">Loading...</div></div>`);
 const[a,b]=cfRng(),R=await cfReport(k,a,b);CF.rep=R;setTimeout(()=>cfWrap($('#cfrep')),0);
 $('#cfrep').innerHTML=`<h4>${R.title} (${a} to ${b})</h4><div class="row" style="margin-bottom:8px"><button class="g" onclick="saveCSV('confectionery-${k}-${a}-to-${b}.csv',[CF.rep.head,...CF.rep.rows])">⬇ Excel / CSV</button><button class="g" onclick="cfPrintHTML(CF.rep.title+' ${a} to ${b}',document.getElementById('cfrt').outerHTML)">🖨 Print / Save as PDF</button></div><table id="cfrt">${cfHead(R.head)}${R.rows.map(r=>'<tr>'+r.map(c=>`<td>${typeof c=='number'?c.toLocaleString():esc(c)}</td>`).join('')+'</tr>').join('')||'<tr><td class="mut">No data in this period.</td></tr>'}</table>`};
async function cfReport(k,a,b){
 if(k=='prod'||k=='inv'){const d=(await cfL('days',['ymd','>=',a],['ymd','<=',b])).sort((x,y)=>x.ymd>y.ymd?1:-1),g={};
  d.forEach(x=>{const r=g[x.pid]||(g[x.pid]={n:x.name,o:CFN(x.open),p:0,s:0,w:0,a:0,c:0});r.p+=CFN(x.produced);r.s+=CFN(x.sold);r.w+=CFN(x.wasted);r.a+=CFN(x.adj);r.c=CFN(x.close)});
  return{title:k=='prod'?'Production Report':'Inventory Report',head:['Product','Opening','Produced','Sold','Damaged','Adjustments','Closing'],rows:Object.values(g).map(r=>[r.n,r.o,r.p,r.s,r.w,r.a,r.c])}}
 if(k=='sales'){const s=(await cfL('sales',['ymd','>=',a],['ymd','<=',b])).filter(x=>x.status=='ok'),g={};s.forEach(x=>x.items.forEach(i=>{const r=g[i.name]||(g[i.name]={q:0,t:0});r.q+=i.qty;r.t+=i.total}));
  return{title:'Sales Report',head:['Product','Quantity','Average price','Total'],rows:Object.entries(g).map(([n,r])=>[n,r.q,cfR2(r.t/r.q),r.t]).concat([['TOTAL',cfSum(Object.values(g),r=>r.q),'',cfSum(Object.values(g),r=>r.t)]])}}
 if(k=='mat'){const t=(await cfL('matTx',['ymd','>=',a],['ymd','<=',b])).sort((x,y)=>x.at-y.at),g={};
  CF.M.forEach(m=>g[m.id]={n:m.name,o:CFN(m.balance),p:0,u:0,w:0,c:CFN(m.balance),f:1});
  t.forEach(x=>{const r=g[x.mid];if(!r)return;if(r.f){r.o=CFN(x.before);r.f=0}if(x.type=='PURCHASE')r.p+=x.qty;if(x.type=='USE')r.u+=x.qty;if(x.type=='WASTE')r.w+=x.qty;if(x.type=='OPENING')r.o=CFN(x.qty);r.c=CFN(x.after)});
  return{title:'Raw Material Report',head:['Item','Opening','Purchased','Used','Wasted','Balance'],rows:Object.values(g).map(r=>[r.n,cfR2(r.o),cfR2(r.p),cfR2(r.u),cfR2(r.w),cfR2(r.c)])}}
 if(k=='exp'){const e=(await cfL('expenses',['ymd','>=',a],['ymd','<=',b])).sort((x,y)=>x.at-y.at);return{title:'Expense Report',head:['Date','Category','Description','Amount','Status','Staff'],rows:e.map(x=>[x.ymd,x.category,x.description,CFN(x.amount),x.status,x.byName])}}
 const r=await cfPL(a,b);return{title:'Financial Report',head:['Item','Amount'],rows:[['Revenue',r.rev],['Cost of goods sold',r.cg],['Gross profit',r.gross],['Wastage cost',r.wc],['Operating expenses',r.eo],['Net profit',r.net],['Materials purchased (info)',r.buy],['Cash received',r.cash],['Credit given',r.credit]]}}

// ===================== DAILY CLOSING =====================
CFT.close=async function(){
 const y=today(),[cl,days,sales,exps,pay,cust,past]=await Promise.all([cfc('closings').doc(y).get(),cfL('days',['ymd','==',y]),cfL('sales',['ymd','==',y]),cfL('expenses',['ymd','==',y]),cfL('payments',['ymd','==',y]),cfL('customers'),cfL('closings')]);
 const ok=sales.filter(s=>s.status=='ok'),me_=m=>cfSum(ok.filter(s=>s.method==m),s=>s.paid)+cfSum(pay.filter(p=>p.method==m),p=>p.amount),show=['admin','finance'].includes(CF.role);
 const snap={ymd:y,rows:days.map(d=>({name:d.name,open:CFN(d.open),prod:CFN(d.produced),adj:CFN(d.adj),sold:CFN(d.sold),wasted:CFN(d.wasted),close:CFN(d.close)})),totalSales:cfSum(ok,s=>s.total),expenses:cfSum(exps.filter(e=>e.status=='Approved'),e=>e.amount),cash:me_('Cash'),transfer:me_('Transfer'),pos:me_('POS'),credit:cfSum(ok,s=>s.balance),outstanding:cfSum(cust,c=>c.owing)};
 CF.snap=snap;const tbl=s=>`<table>${cfHead(['Product','Opening','+ Production','± Adjust','− Sales','− Wastage','= Closing'])}${s.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.open}</td><td>${r.prod}</td><td>${r.adj}</td><td>${r.sold}</td><td>${r.wasted}</td><td><b>${r.close}</b></td></tr>`).join('')||'<tr><td colspan=7 class="mut">No activity.</td></tr>'}</table><div class="grid">${cfCard('Total sales',money(s.totalSales))}${cfCard('Total expenses',money(s.expenses))}${cfCard('Cash received',money(s.cash))}${cfCard('Transfer',money(s.transfer))}${cfCard('POS',money(s.pos))}${cfCard('Credit sales',money(s.credit))}${cfCard('Outstanding balance',money(s.outstanding))}</div>`;
 cfBody(`<div class="card"><h3>Daily Confectionery Closing - ${y}</h3>${cl.exists?`<p class="green">✔ Closed by ${esc(cl.data().closedBy)} at ${new Date(cl.data().at).toLocaleString()}. Ordinary staff can no longer post to this day.</p>${tbl(cl.data())}${CF.role=='admin'?'<button class="s" onclick="cfReopen()">Reopen day (administrator)</button>':''}`:`${tbl(snap)}<button onclick="cfCloseDay()">🔒 Close the day</button>`}</div>
 <div class="card"><h3>Previous closings</h3><table>${cfHead(['Date','Sales','Expenses','Closed by'])}${past.sort((a,b)=>a.ymd<b.ymd?1:-1).slice(0,30).map(c=>`<tr><td>${c.ymd}</td><td>${money(c.totalSales)}</td><td>${money(c.expenses)}</td><td>${esc(c.closedBy)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">None yet.</td></tr>'}</table></div>`)};
async function cfCloseDay(){if(!confirm('Close today? Ordinary staff will no longer be able to record anything for today.'))return;
 await cfRun(async()=>{const b=db.batch(),s=CF.snap;b.set(cfc('closings').doc(s.ymd),cst({...s,closedBy:me.name}));cfAud(b,'DAY_CLOSE',s.ymd,null,{sales:s.totalSales},`${me.name} closed confectionery day ${s.ymd}`);await b.commit()},'Day closed');await cfAfter('Daily confectionery closing completed')}
async function cfReopen(){if(!confirm('Reopen today?'))return;await cfRun(async()=>{const b=db.batch();b.delete(cfc('closings').doc(today()));cfAud(b,'DAY_REOPEN',today(),null,null,`${me.name} reopened confectionery day ${today()}`);await b.commit()},'Day reopened');cfDraw()}

CFT.prods=async function(){
 cfBody(`<div class="card"><div class="row"><h3 style="flex:1">Product Management</h3><button onclick="cfProdForm()">+ ADD PRODUCT</button></div><table>${cfHead(['','Name','Category','SKU','Price','Prod. cost','Unit','Min stock','Status','Added',''])}${CF.P.map(p=>`<tr><td>${p.image?`<img class="cfth" src="${esc(p.image)}">`:''}</td><td>${esc(p.name)}</td><td>${esc(p.category||'')}</td><td>${esc(p.sku||'')}</td><td><b>${money(p.price)}</b></td><td>${money(p.cost)}</td><td>${esc(p.unit||'')}</td><td>${CFN(p.min)}</td><td>${esc(p.status||'Active')}</td><td>${p.addedAt?ld(p.addedAt):''}</td><td><button class="g" onclick="cfProdForm('${p.id}')">Edit</button> <button class="g" onclick="cfToggleProd('${p.id}')">${p.status=='Inactive'?'Activate':'Deactivate'}</button></td></tr>`).join('')||'<tr><td colspan=11 class="mut">No products yet. Tap + ADD PRODUCT (e.g. Bread, Meat Pie, Doughnut, Sausage Roll, Cake, Small Chops, Chin Chin, Egg Roll, Puff Puff).</td></tr>'}</table></div>`)};
function cfProdForm(id){const p=CF.P.find(x=>x.id==id)||{};CF.img='';
 cfModal(`<h3>${id?'Edit':'Add'} product</h3><div class="cfg2">${cfF('n','Product name','text',p.name)}${cfS('c','Category',PCAT,p.category)}${cfF('sk','Code / SKU','text',p.sku)}${cfF('pr','Selling price (₦)','number',p.price)}${cfF('co','Production cost (₦)','number',p.cost)}${cfS('u','Unit',PUNIT,p.unit)}${cfF('mn','Minimum stock level','number',p.min)}${cfS('st','Status',['Active','Inactive'],p.status||'Active')}</div><label class="cfl">Product image<input type="file" accept="image/*" onchange="cfImg(this)"></label><div class="row"><button onclick="cfSaveProd('${id||''}')">Save</button><button class="g" onclick="cfClose()">Cancel</button></div>`)}
function cfImg(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);CF.img=c.toDataURL('image/jpeg',.75)};im.src=URL.createObjectURL(f)}
async function cfSaveProd(id){const g=cfG();if(!g.n||CFN(g.pr)<=0)return cfToast('Name and selling price are required',true);
 const o={name:g.n,category:g.c,sku:g.sk,price:CFN(g.pr),cost:CFN(g.co),unit:g.u,min:CFN(g.mn),status:g.st};if(CF.img)o.image=CF.img;
 await cfRun(async()=>{const b=db.batch(),old=CF.P.find(x=>x.id==id);
  if(id){b.set(cfc('products').doc(id),cfUp(o),{merge:true});
   if(CFN(old.price)!=o.price)cfAud(b,'PRICE_CHANGE',id,{price:old.price},{price:o.price},`${me.name} changed ${o.name} price from ${money(old.price)} to ${money(o.price)}`);
   else cfAud(b,'PRODUCT_EDIT',id,null,o,`${me.name} edited product ${o.name}`)}
  else{const r=cfc('products').doc();b.set(r,cst({...o,addedAt:Date.now()}));b.set(cfc('stock').doc(r.id),{qty:0,avgCost:o.cost,name:o.name,createdBy:me.uid,updatedBy:me.uid,updatedAt:Date.now(),by:me.uid});cfAud(b,'PRODUCT_ADD',r.id,null,o,`${me.name} added product ${o.name} at ${money(o.price)}`)}
  await b.commit();cfClose()},'Product saved');await cfInit();cfDraw()}
async function cfToggleProd(id){const p=CF.P.find(x=>x.id==id),s=p.status=='Inactive'?'Active':'Inactive';
 await cfRun(async()=>{const b=db.batch();b.set(cfc('products').doc(id),cfUp({status:s}),{merge:true});cfAud(b,'PRODUCT_STATUS',id,{status:p.status},{status:s},`${me.name} set ${p.name} to ${s}`);await b.commit()},'Updated');await cfInit();cfDraw()}

function cfRecForm(id){const p=CF.P.find(x=>x.id==id),r=CF.R[id]||{batch:100,items:[]},rows=(r.items&&r.items.length?r.items:[{}]);CF.recRows=rows.length;

const cfRecRow=(k,it)=>`<div class="row">${cfS('mi'+k,'Material',[['','-'],...CF.M.map(m=>[m.id,m.name+' ('+m.unit+')'])],it.mid||'')}${cfF('mq'+k,'Quantity','number',it.qty||'')}</div>`;
function cfRecAdd(){const k=CF.recRows++;$('#cfri').insertAdjacentHTML('beforeend',cfRecRow(k,{}))}

 if(CFN(g.b)<=0)return cfToast('Enter the batch size',true);

// ---------- Owner-only reset of confectionery data ----------
const CF_RESET=[
 ['sales','Sales, receipts and financial ledger (sales, transactions, customer payments)',['sales','fintx','payments','keys']],
 ['prod','Production records and daily stock history',['production','days']],
 ['stock','Product stock quantities (set every product to 0)','ZERO'],
 ['mat','Raw materials and material movements',['materials','matTx']],
 ['pur','Purchases and suppliers',['purchases','suppliers']],
 ['exp','Expenses',['expenses']],
 ['waste','Wastage records',['wastage']],
 ['cust','Customers and their balances',['customers']],

CFT.reset=async function(){
 if(!CF_OWNER.includes(me.role))return cfBody('<div class="card">Not allowed.</div>');
 cfBody(`<div class="card"><h3>⚠️ Reset Confectionery Data (Owner only)</h3><p class="mut">Tick the sections you want to erase. Erasing is permanent. Each section only clears its own records, so reset related sections together (for example Sales + Production + Stock) to keep figures consistent. Staff roles and settings are never reset.</p>
 <label class="cfl"><input type="checkbox" style="width:auto" onchange="document.querySelectorAll('.cfrs').forEach(c=>c.checked=this.checked)"> <b>Select ALL (full reset)</b></label>
 ${CF_RESET.map(r=>`<label class="cfl"><input type="checkbox" class="cfrs" value="${r[0]}" style="width:auto"> ${esc(r[1])}</label>`).join('')}
 <div class="row" style="margin-top:10px"><button class="s" onclick="cfResetAsk()">Reset selected…</button></div></div>`)};
function cfResetAsk(){const sel=[...document.querySelectorAll('.cfrs:checked')].map(x=>x.value);if(!sel.length)return cfToast('Tick at least one section',true);CF.rsel=sel;
 cfModal(`<h3 class="red">Confirm reset</h3><p>You are about to permanently erase:</p><ul>${sel.map(k=>`<li>${esc(CF_RESET.find(r=>r[0]==k)[1])}</li>`).join('')}</ul><p>Type <b>RESET</b> to continue:</p><input id="m_rc" placeholder="RESET"><div class="row" style="margin-top:10px"><button class="s" onclick="cfResetGo()">Erase now</button><button class="g" onclick="cfClose()">Cancel</button></div>`)}
async function cfWipe(c){let n=0;for(;;){const s=await cfc(c).limit(400).get();if(s.empty)break;const b=db.batch();s.docs.forEach(d=>b.delete(d.ref));await b.commit();n+=s.size}return n}
async function cfResetGo(){
 if(v('m_rc')!=='RESET')return cfToast('Type RESET exactly (capital letters)',true);if(!CF_OWNER.includes(me.role))return;const sel=CF.rsel||[];
 await cfRun(async()=>{const cols=[];let zero=false;
  sel.forEach(k=>{const r=CF_RESET.find(x=>x[0]==k);if(r[2]=='ZERO')zero=true;else r[2].forEach(c=>{if(!cols.includes(c))cols.push(c)})});
  if(sel.length==CF_RESET.length)cols.push('counters');
  let n=0;for(const c of cols)n+=await cfWipe(c);
  if(zero&&!cols.includes('stock')){const s=await cfc('stock').get();for(let i=0;i<s.docs.length;i+=400){const b=db.batch();s.docs.slice(i,i+400).forEach(d=>b.set(d.ref,{qty:0,updatedAt:Date.now(),updatedBy:me.uid,by:me.uid},{merge:true}));await b.commit()}}
  const b=db.batch();cfAud(b,'RESET',sel.join(','),null,{sections:sel,deleted:n},`${me.name} reset confectionery data: ${sel.join(', ')}`);await b.commit();cfClose()},'Reset complete');
 await cfInit();cfDraw()}

// ---------- Live "new message" notifications (banner + sound + browser notification + tab counter) ----------
{const st=document.createElement('style');st.textContent=`
#ntb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);transition:transform .35s;z-index:300;width:min(440px,94vw);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-left:5px solid var(--gold);border-radius:14px;box-shadow:0 10px 36px #0006;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
#ntb.on{transform:translate(-50%,0)}#ntb i{font-style:normal;font-size:26px}#ntb b{display:block;font-size:14px}#ntb span{display:block;font-size:13px;color:var(--mut);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#ntp{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:250;width:min(440px,94vw);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 36px #0006;padding:12px 14px}`;document.head.appendChild(st)}
const NT={base:document.title,unsubs:[],timer:null,reg:null};
function ntBeep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.45);o.start();o.stop(a.currentTime+.45)}catch(e){}}
function ntOpen(){try{window.focus()}catch(e){}if(me)go('msg')}
function ntBanner(t,x){let b=$('#ntb');if(!b){b=document.createElement('div');b.id='ntb';document.body.appendChild(b)}
 b.innerHTML=`<i>💬</i><div><b>${esc(t)}</b><span>${esc(x)}</span></div>`;b.onclick=()=>{b.classList.remove('on');ntOpen()};
 requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add('on')));clearTimeout(NT.timer);NT.timer=setTimeout(()=>b.classList.remove('on'),8000)}
async function ntSys(t,x){try{if(!('Notification' in window)||Notification.permission!=='granted')return;
 const o={body:x,icon:LOGO_URL,tag:'ds-msg',renotify:true};
 if(NT.reg)await NT.reg.showNotification(t,o);else{const n=new Notification(t,o);n.onclick=()=>{ntOpen();n.close()}}}catch(e){console.warn('notification',e)}}
function ntAlert(t,x){ntBeep();ntBanner(t,x);if(document.hidden)ntSys(t,x);try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}badge()}
function ntStop(){NT.unsubs.forEach(u=>{try{u()}catch(e){}});NT.unsubs=[];const b=$('#ntb');if(b)b.classList.remove('on')}
function ntAsk(){try{if(!('Notification' in window)||Notification.permission!=='default'||localStorage.getItem('ntNo')==me.uid||$('#ntp'))return}catch(e){return}
 const d=document.createElement('div');d.id='ntp';d.innerHTML='<b>🔔 Turn on notifications</b><p class="mut" style="margin:4px 0 8px">Get an alert whenever you receive a new message.</p><div class="row"><button id="ntyes">Turn on</button><button class="g" id="ntno">Not now</button></div>';document.body.appendChild(d);
 $('#ntyes').onclick=async()=>{d.remove();try{await Notification.requestPermission()}catch(e){}};$('#ntno').onclick=()=>{d.remove();try{localStorage.setItem('ntNo',me.uid)}catch(e){}}}
function ntStart(){ntStop();if(!me)return;const mg=MG.includes(me.role),err=e=>console.warn('notify',e.code);
 try{if('serviceWorker' in navigator&&location.protocol=='https:'&&!/google/.test(location.host)){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(r=>{NT.reg=r}).catch(()=>{});navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.open)ntOpen()})}}catch(e){}
 let f1=true;
 NT.unsubs.push((mg?db.collection('messages').where('mgmt','==',false):db.collection('messages').where('thread','==',me.uid)).onSnapshot(s=>{
  if(f1){f1=false;return}
  s.docChanges().forEach(c=>{if(c.type!='added')return;const m=c.doc.data();if(m.by==me.uid||!!m.mgmt==mg)return;
   ntAlert(m.mgmt?'New message from School Management':'New message from '+(m.threadName||m.byName||'a user'),m.text||'')})},err));
 if(!mg){let f2=true;NT.unsubs.push(db.collection('announcements').where('audience','==',me.role=='student'?'students':'staff').onSnapshot(s=>{
  if(f2){f2=false;return}
  s.docChanges().forEach(c=>{if(c.type!='added')return;const m=c.doc.data();if(m.by==me.uid)return;ntAlert('New announcement: '+(m.title||''),m.body||'')})},err))}
 setTimeout(ntAsk,2500)}
{const o=badge;badge=async function(){await o();document.title=(BN?'('+BN+') ':'')+NT.base}}
{const o=enter;enter=async function(u){await o(u);if(auth.currentUser&&me)ntStart()}}
auth.onAuthStateChanged(u=>{if(!u)ntStop()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)badge()});

</script></body></html>
