<script>

const CFG={apiKey:"AIzaSyDLryqwFI885uE0xQzSUN2Qo0MZZoDxVm0",authDomain:"divine-seeds-portal.firebaseapp.com",projectId:"divine-seeds-portal",storageBucket:"divine-seeds-portal.firebasestorage.app",messagingSenderId:"151651524541",appId:"1:151651524541:web:cd28e4cefe26d72f6a7cd4"};
firebase.initializeApp(CFG);

// ---- School settings (EDIT THESE) ----
const SCHOOL={email:'info@divineseeds.edu.ng',phone:'+234 800 000 0000',loc:{'Ediam':'Ediam, Eket, Akwa Ibom','Ikot Oso':'Ikot Oso, Eket, Akwa Ibom'}};
const CLASSES=['Creche','Nursery 1','Nursery 2','Nursery 3','Primary 1','Primary 2','Primary 3','Primary 4','Primary 5','Primary 6','JSS1','JSS2','JSS3','SS1','SS2','SS3'];

let me,photo='',FEE={st:[],paid:{},fs:[],owing:[]},TEACH=[],SD={},STF={},FIN={fs:[],ex:[],ses:[]};

const P=firebase.auth.Auth.Persistence;const ready=(async()=>{for(const m of [P.LOCAL,P.SESSION,P.NONE]){try{await auth.setPersistence(m);return}catch(e){}}})();

const MENU={student:['dash:Dashboard','news:Announcements','acct:My Account'],
teacher:['dash:My Dashboard','comp:Compute Results','roll:Class Attendance','attend:Attendance','news:Announcements','acct:My Account'],

MENU.proprietor=MENU.admin=[...MENU.principal,'staffreg:Staff & Roles','stat:Stationery','reset:Reset'];
// Chairman and School Administrator: everything except Reset
MENU.chairman=MENU.administrator=[...MENU.principal,'staffreg:Staff & Roles','stat:Stationery'];

let unlocked=false;
const bioKey=uid=>'dsbio_'+uid,
 ckGet=k=>{const m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));return m?decodeURIComponent(m[1]):null},
 ckSet=(k,x)=>{document.cookie=k+'='+(x?encodeURIComponent(x)+';max-age=31536000':';max-age=0')+';path=/;SameSite=Lax'},

 bioOK=()=>!!(window.PublicKeyCredential&&navigator.credentials),

auth.onAuthStateChanged(async user=>{
  if(!user){unlocked=false;loginBox.style.display='grid';appBox.style.display='none';return}
  if(bioGet(user.uid)&&!unlocked){showLock();return}
  unlocked=true;await enter(user);
});
async function enter(user){
  try{
    const d=await db.doc('users/'+user.uid).get();
    if(!d.exists){err.textContent='Signed in, but no role profile was found. In Firestore, create users/'+user.uid+' with role and name fields.';await auth.signOut();return}
    me={uid:user.uid,...d.data()};
    if(!me.role){err.textContent='Your Firestore users profile is missing the role field.';await auth.signOut();return}
    lbReset();loginBox.style.display='none';appBox.style.display='grid';
    document.body.className=me.role==='student'?'student':'';
    $('#bell').style.display=MG.includes(me.role)?'inline':'none';
    $('#lockBtn').style.display=bioGet(user.uid)?'inline':'none';
    const m=MENU[me.role]||MENU.staff;
    side.innerHTML=`<img src="${esc(LOGO_URL)}" alt="Divine Seeds logo" onerror="this.style.display='none'"><h4>DIVINE SEEDS</h4>`+m.map(i=>{const[k,l]=i.split(':');return`<a data-k="${k}" onclick="go('${k}')">${l}</a>`}).join('');
    go(m[0].split(':')[0]);
  }catch(e){console.error('Profile load failed:',e.code,e.message);err.textContent='Signed in, but could not read your Firestore profile. Check Firestore rules and the users document.';await auth.signOut()}
}

// ---------- Login, recovery ----------
async function resolveEmail(x){
  x=x.trim().toLowerCase();
  if(x.includes('@'))return x;
  try{const c=localStorage.getItem('dsu_'+x);if(c)return c}catch(e){}
  try{const d=await db.doc('usernames/'+x).get();if(d.exists&&d.data().email){try{localStorage.setItem('dsu_'+x,d.data().email)}catch(e){}return d.data().email}}catch(e){console.warn('username lookup failed',e.code)}
  return x+FAKE; // older accounts
}
function lbReset(){const b=$('#lb');b.disabled=false;b.textContent='Sign in'}
async function login(){
  err.textContent='';info.textContent='';
  const pw=v('p');
  if(!v('u').trim()||!pw){err.textContent='Enter your username and password.';return}
  const lb=$('#lb');lb.disabled=true;lb.textContent='Signing in...';
  await ready;
  const email=await resolveEmail(v('u'));
  unlocked=true;
  try{await auth.signInWithEmailAndPassword(email,pw)}catch(e){
    unlocked=false;lbReset();
    if(e.code=='auth/user-not-found'||e.code=='auth/invalid-email'){try{localStorage.removeItem('dsu_'+v('u').trim().toLowerCase())}catch(_){}}
    console.error('Sign-in failed:',e.code,e.message);
    const M={'auth/invalid-email':'The username/email format is invalid.','auth/invalid-credential':'The username or password is incorrect. If several people share one email, sign in with your USERNAME. Use "Forgot password?" to reset it.','auth/wrong-password':'The password is incorrect. Use "Forgot password?" to reset it.','auth/user-not-found':'No account matches this username.','auth/too-many-requests':'Too many attempts. Wait a while, or reset your password.','auth/operation-not-allowed':'Email/password sign-in is disabled in Firebase Authentication.','auth/network-request-failed':'Network error. Check your internet connection.','auth/unauthorized-domain':'This site domain is not authorized in Firebase Authentication → Settings → Authorized domains.'};
    err.textContent=M[e.code]||('Login failed: '+(e.code||'unknown error'));
  }
}
// Password reset. Works with a username (sends to that account's recovery address) or with a SHARED email
// (sends one reset link per account that uses that email; each link shows the username inside the address).
async function forgot(){
  err.textContent='';info.textContent='';
  const x=v('u').trim().toLowerCase();
  if(!x){err.textContent='Type your username (or email) above first, then tap Forgot password.';return}
  let targets=[];
  if(x.includes('@')){
    try{const q=await db.collection('usernames').where('real','==',x).get();targets=q.docs.map(d=>d.data().email)}catch(e){console.warn('shared-email lookup',e.code)}
    targets.push(x);
  }else{
    const email=await resolveEmail(x);
    if(email.endsWith(FAKE)){err.textContent='No recovery email is saved for this account. Please contact the school office.';return}
    targets=[email];
  }
  targets=[...new Set(targets.filter(Boolean))];
  for(const t of targets){
    try{await auth.sendPasswordResetEmail(t)}catch(e){if(e.code!=='auth/user-not-found'&&e.code!=='auth/invalid-email'){err.textContent='Could not send reset email: '+e.code;return}}
  }
  info.textContent=targets.length>1?'Reset links have been sent for each account that uses this email. Check your inbox and spam folder; the address in each message contains the username it belongs to.':'If this account has a recovery email, a reset link has been sent. Check your inbox and spam folder.';
}
function showLock(){appBox.style.display='none';loginBox.style.display='grid';err.textContent='';info.textContent='Locked. Tap "Sign in with Fingerprint" to continue.'}

 err.textContent='';info.textContent='';
 if(!bioOK()){err.textContent='This browser/device does not support fingerprint sign-in. Use your password.';return}

 if(!u||!bioGet(u.uid)){err.textContent='Fingerprint is not ready on this device. Sign in with your password, enable fingerprint in My Account, then use the Lock button (not Logout) when you leave.';return}
 try{await verifyBio(u.uid);unlocked=true;await enter(u)}catch(e){console.warn(e);err.textContent='Fingerprint not recognised or cancelled. Try again or use your password.'}}
async function verifyBio(uid){
 const id=bioGet(uid);if(!id)throw new Error('not enrolled');
 await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(id),transports:['internal']}],userVerification:'required',timeout:60000}})}

 const m=$('#bmsg');m.className='red';
 if(!bioOK()){m.textContent='This browser/device does not support fingerprint sign-in.';return}
 try{
  if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())){m.textContent='No fingerprint or screen-lock biometric is set up on this device.';return}
  const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Divine Seeds Portal'},user:{id:new TextEncoder().encode(me.uid),name:me.username||me.name,displayName:me.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  bioSet(me.uid,b64(c.rawId));$('#lockBtn').style.display='inline';V.acct();
 }catch(e){m.textContent='Could not enable fingerprint ('+(e.name||e.message)+'). If the portal is opened inside Apps Script, the browser may block it; use the GitHub Pages link.'}}
function disableBio(){bioSet(me.uid,null);$('#lockBtn').style.display='none';V.acct()}

const add=(c,o)=>db.collection(c).add({...o,by:me.uid,byName:me.name,at:Date.now()});

 if(!MSG.th)return alert('Choose who to message.');if(!t)return alert('Write a message first.');
 try{await add('messages',{thread:MSG.th,threadName:MSG.name,text:t,fromRole:me.role,mgmt:mg,read:false});if(!mg)await notify('New message reply from '+me.name);go('msg')}
 catch(e){alert('Could not send: '+(e.code||e.message))}}
V.news=async function(){
 const mg=MG.includes(me.role),aud=me.role=='student'?'students':'staff',a=(await list('announcements',...(mg?[]:[['audience','==',aud]]))).sort((x,y)=>y.at-x.at);
 let rd=[],tot={},fresh=new Set();
 if(mg){const[r,s,t]=await Promise.all([list('annReads'),list('students'),list('staff')]);rd=r;tot={students:s.length,staff:t.length}}
 else{const r=await list('annReads',['uid','==',me.uid]),seen=new Set(r.map(x=>x.annId)),nw=a.filter(x=>!seen.has(x.id));nw.forEach(x=>fresh.add(x.id));
  if(nw.length){const b=db.batch();nw.forEach(x=>b.set(db.doc('annReads/'+x.id+'_'+me.uid),{annId:x.id,uid:me.uid,name:me.name,role:me.role,at:Date.now()}));try{await b.commit();badge()}catch(e){console.warn(e.code)}}}
 set((mg?`<div class="card"><h3>Post Announcement</h3><select id="aud"><option value="students">Students</option><option value="staff">Teachers & Staff</option></select><input id="ann_t" placeholder="Title"><textarea id="ann_b" rows="4" placeholder="Message"></textarea><button onclick="postNews()">Publish</button></div>`:'')+
 (a.map(x=>{const rs=rd.filter(r=>r.annId==x.id);return`<div class="card nw"><b>${esc(x.title)}</b> <span class="tag" style="background:var(--acc)">${esc(x.audience)}</span> ${fresh.has(x.id)?'<span class="tag" style="background:var(--ok)">NEW</span>':''}<p class="just">${esc(x.body)}</p><small class="mut">${esc(x.byName)} · ${new Date(x.at).toLocaleString()}</small>${mg?`<details style="margin-top:8px"><summary class="rd ok">👁 Seen by ${rs.length} of ${tot[x.audience]||0}</summary>${rs.map(r=>`<div class="rd">✓ ${esc(r.name)} · ${new Date(r.at).toLocaleString()}</div>`).join('')||'<div class="rd">Nobody yet.</div>'}</details>`:''}</div>`}).join('')||'<div class="card">No announcements yet.</div>'))};

// ---------- Validate results: owing students blocked; correct results after computing ----------
async function owingMap(){
 const[st,fs]=await Promise.all([list('students'),list('fees')]),p={},o={};
 fs.forEach(x=>p[x.studentId]=(p[x.studentId]||0)+(+x.amount||0));
 st.forEach(s=>{const b=(+s.feeDue||0)-(p[s.id]||0);if(b>0)o[s.id]=b});return o}
let VR=[];
V.pub=async function(){
 const[r,ow,vr]=await Promise.all([list('results',['published','==',false]),owingMap(),list('results',['published','==',true])]);VR=vr;
 const ok=r.filter(x=>!ow[x.studentId]).length;
 set(`<div class="card"><h3>Results awaiting validation</h3><p class="mut">Results of students who owe fees cannot be validated until the balance is cleared.</p><table><tr><th>Student</th><th>Class</th><th>Subject</th><th>Trimester</th><th>Total</th><th>Fees</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.studentName)}</td><td>${esc(x.class||'')}</td><td>${esc(x.subject)}</td><td>${esc(x.trimester)}</td><td>${x.test+x.exam}</td><td>${ow[x.studentId]?`<span class="tag" style="background:var(--bad)">Owing ${money(ow[x.studentId])}</span>`:'<span class="green">Cleared</span>'}</td><td>${ow[x.studentId]?'':`<button data-id="${esc(x.id)}" onclick="publish(this.dataset.id)">Validate</button>`}</td></tr>`).join('')||'<tr><td>Nothing waiting.</td></tr>'}</table>${ok?`<button class="s" onclick="publishAll()">Validate all cleared (${ok})</button>`:''}</div>
 <div class="card"><h3>Validated results - correct or recall</h3><input id="pv_q" placeholder="🔍 Search student, class or subject" oninput="drawVR()"><table><tr><th>Student</th><th>Class</th><th>Subject</th><th>Trimester</th><th>Test</th><th>Exam</th><th>Total</th><th></th></tr><tbody id="vrTb"></tbody></table></div>`);drawVR()};
function drawVR(){const q=v('pv_q').toLowerCase();$('#vrTb').innerHTML=VR.filter(x=>((x.studentName||'')+' '+(x.subject||'')+' '+(x.class||'')).toLowerCase().includes(q)).slice(0,100).map(x=>`<tr><td>${esc(x.studentName)}</td><td>${esc(x.class||'')}</td><td>${esc(x.subject)}</td><td>${esc(x.trimester)}</td><td>${x.test}</td><td>${x.exam}</td><td>${x.test+x.exam}</td><td><button class="g" data-id="${esc(x.id)}" onclick="fixRes(this.dataset.id)">Correct</button> <button class="s" data-id="${esc(x.id)}" onclick="unval(this.dataset.id)">Recall</button></td></tr>`).join('')||'<tr><td>None found.</td></tr>'}
async function fixRes(id){
 const x=VR.find(r=>r.id==id),t=prompt('Test score (0-40): '+x.studentName+' - '+x.subject,x.test);if(t===null)return;
 const e=prompt('Exam score (0-60)',x.exam);if(e===null)return;
 if(t===''||e===''||+t<0||+t>40||+e<0||+e>60)return alert('Test must be 0-40 and exam 0-60.');
 try{await db.doc('results/'+id).update({test:+t,exam:+e,correctedBy:me.name,correctedAt:Date.now()});await notify('Result corrected: '+x.studentName+' ('+x.subject+') by '+me.name);go('pub')}catch(err){alert('Could not save: '+(err.code||err.message))}}
async function unval(id){if(!confirm('Recall this result for re-computation? The student will not see it until you validate again.'))return;try{await db.doc('results/'+id).update({published:false});go('pub')}catch(e){alert(e.code||e.message)}}
async function publish(id){
 const d=await db.doc('results/'+id).get(),b=(await owingMap())[(d.data()||{}).studentId];
 if(b)return alert('Blocked: this student owes '+money(b)+'. Clear the fees first.');
 await db.doc('results/'+id).update({published:true});await notify('Results validated');go('pub')}
async function publishAll(){
 const ow=await owingMap(),docs=(await db.collection('results').where('published','==',false).get()).docs.filter(d=>!ow[d.data().studentId]);
 if(!docs.length)return alert('Nothing to validate (owing students are blocked).');
 if(!confirm('Validate '+docs.length+' result(s)? Results of owing students are skipped.'))return;
 for(let i=0;i<docs.length;i+=400){const b=db.batch();docs.slice(i,i+400).forEach(d=>b.update(d.ref,{published:true}));await b.commit()}
 await notify('Pending results validated (owing students skipped)');go('pub')}

function drawTT(){

 set(`<div class="card"><h3>School Time Table</h3><div class="tabs">${TTD.map(x=>`<button class="${x==TT.d?'':'g'}" onclick="ttDay('${x}')">${x}</button>`).join('')}</div>

function ttCollect(){document.querySelectorAll('#ttb input').forEach(i=>{const k=TT.d+'|'+i.dataset.c,a=TT.data[k]||(TT.data[k]=Array(13).fill(''));a[+i.dataset.i]=i.value.trim()})}
function ttDay(x){if(TT.edit)ttCollect();TT.d=x;drawTT()}
async function ttSave(){ttCollect();try{await db.doc('settings/timetable').set({data:TT.data,by:me.name,at:Date.now()});TT.edit=false;alert('Time table saved.');drawTT()}catch(e){alert('Could not save: '+(e.code||e.message))}}
function ttPrint(){const w=window.open('');if(!w)return alert('Allow pop-ups.');w.document.write('<body style="font-family:Arial;padding:20px"><h2>Divine Seeds International Eket - Time Table ('+TT.d+')</h2>'+document.getElementById('ttb').outerHTML.replace(/<input[^>]*value="([^"]*)"[^>]*>/g,'$1')+'<style>table{border-collapse:collapse;font-size:11px}td,th{border:1px solid #333;padding:4px;text-align:center}</style><script>print()<\/script>')}
