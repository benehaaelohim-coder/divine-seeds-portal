<!DOCTYPE html><html><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#10213f;--mut:#6b7a96;--pri:#1c3f94;--acc:#e0147a;--gold:#f5b700;--side:#10213f;--ok:#12a150;--bad:#e5313d;--bd:#e3e9f4}
body.student{--bg:#0e1a2e;--card:#16253d;--tx:#eef2fa;--mut:#9fb0cc;--bd:#243656;--side:#0a1424;--pri:#e8c77a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#10213f,#1c3f94 60%,#e0147a);padding:16px}
.lbox{background:#fff;color:#10213f;border-radius:20px;padding:32px;width:min(400px,100%);text-align:center;box-shadow:0 20px 60px #0006}
.lbox img{width:130px}.lbox small{color:#e0147a;font-weight:600}
input,select,textarea,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);width:100%;margin:5px 0;background:var(--card);color:var(--tx)}
button{background:var(--pri);color:#fff;border:0;cursor:pointer;font-weight:600;width:auto}body.student button{color:#10213f}
button.s{background:var(--acc);color:#fff}button.g{background:transparent;color:var(--pri);border:1px solid var(--pri)}
#app{display:none;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--side);color:#fff;padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
aside img{width:70px;display:block;margin:0 auto 6px}aside h4{text-align:center;margin:0 0 14px;font-size:13px;color:var(--gold)}
aside a{display:block;padding:10px 12px;border-radius:10px;color:#cfd9ee;cursor:pointer;margin:2px 0}aside a:hover,aside a.on{background:#ffffff22;color:#fff}
main{padding:20px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
.stat b{font-size:24px;display:block}.stat span{color:var(--mut);font-size:13px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.pic{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);background:#ccd}
table{width:100%;border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.red{color:var(--bad);font-weight:700}.green{color:var(--ok);font-weight:700}.tag{padding:3px 10px;border-radius:20px;font-size:12px;color:#fff}
#menu{display:none}
@media(max-width:800px){#app{grid-template-columns:1fr}aside{position:fixed;left:-260px;width:240px;z-index:9;transition:.2s}aside.open{left:0}#menu{display:inline-block}}
</style></head><body>
<div id="login"><div class="lbox"><img src="https://raw.githubusercontent.com/benehaaelohim-coder/divine-seeds-portal/main/logo.png" alt="Divine Seeds" style="width:48px;height:48px;object-fit:contain"> alt="Divine Seeds International Schools logo" onerror="this.style.display='none'"><h2>DIVINE SEEDS INTERNATIONAL EKET</h2><small>Training Godly Future Champions</small><br><br>
<input id="u" placeholder="Username / ID"><input id="p" type="password" placeholder="Password"><button onclick="login()" style="width:100%">Sign in</button>
<button class="g" onclick="bio()" style="width:100%">Sign in with Fingerprint</button><p id="err" class="red"></p></div></div>
<div id="app"><aside id="side"></aside><main><div class="top"><button id="menu" onclick="side.classList.toggle('open')">☰</button><h2 id="ttl"></h2><div><span id="bell" style="cursor:pointer" onclick="go('notes')">🔔</span> <button class="g" onclick="auth.signOut()">Logout</button></div></div><div id="main"></div></main></div>
<script>
const LOGO_URL="https://raw.githubusercontent.com/https://raw.githubusercontent.com/benehaaelohim-coder/divine-seeds-portal/main/logo.png  Copy logo URL/divine-seeds-portal/main/logo.png";

const CFG = {
  apiKey: "AIzaSyDLryqwFI885uE0xQzSUN2Qo0MZZoDxVm0",
  authDomain: "divine-seeds-portal.firebaseapp.com",
  projectId: "divine-seeds-portal",
  storageBucket: "divine-seeds-portal.firebasestorage.app",
  messagingSenderId: "151651524541",
  appId: "1:151651524541:web:cd28e4cefe26d72f6a7cd4"
};

firebase.initializeApp(CFG);

const auth = firebase.auth();
const db = firebase.firestore();
const $ = s => document.querySelector(s);

const money=n=>'₦'+Number(n||0).toLocaleString(),today=()=>new Date().toISOString().slice(0,10);
const TOP=['proprietor','admin'],MG=['proprietor','admin','principal'];let me,photo='';
const MENU={student:['dash:Dashboard','news:Announcements'],teacher:['dash:My Dashboard','scores:Enter Scores','attend:Attendance','news:Announcements'],
staff:['dash:My Dashboard','attend:Attendance','news:Announcements'],
principal:['mgmt:Overview','reg:Registration','news:Post Announcement','pub:Validate Results','attend:Attendance','bread:Confectionery','notes:Notifications'],
proprietor:null,admin:null};
MENU.proprietor=MENU.admin=[...MENU.principal,'staffreg:Staff & Roles','stat:Stationery','reset:Reset'];
auth.onAuthStateChanged(async user=>{
  if(!user){
    login_.style.display='grid';
    app.style.display='none';
    return;
  }
  try {
    const doc = await db.doc('users/' + user.uid).get();
    if(!doc.exists){
      err.textContent = 'Signed in, but no role profile was found for this account. In Firestore, create users/' +
        user.uid + ' with role and name fields.';
      await auth.signOut();
      return;
    }
    me = {uid:user.uid, ...doc.data()};
    if(!me.role){
      err.textContent = 'Your Firestore users profile is missing the role field.';
      await auth.signOut();
      return;
    }
    login_.style.display='none';
    app.style.display='grid';
    document.body.className = me.role === 'student' ? 'student' : '';
    side.innerHTML = `<img src="${LOGO_URL}"><h4>DIVINE SEEDS</h4>` +
      (MENU[me.role] || MENU.staff).map(item=>{
        const [key,label] = item.split(':');
        return `<a data-k="${key}" onclick="go('${key}')">${label}</a>`;
      }).join('');
    go((MENU[me.role] || MENU.staff)[0].split(':')[0]);
  } catch (e) {
    console.error('Could not load user profile:', e.code, e.message);
    err.textContent = 'Signed in, but could not read your Firestore profile. Check Firestore rules and the users document.';
    await auth.signOut();
  }
});
const login_=$('#login'),app=$('#app'),side=$('#side'),err=$('#err');
async function login(){
  const entered = u.value.trim().toLowerCase();
  const password = p.value;
  err.textContent = '';

  if (!entered || !password) {
    err.textContent = 'Enter your username and password.';
    return;
  }

  // The portal uses usernames mapped to @divineseeds.app emails.
  // Also accept a full email address if one is entered.
  const email = entered.includes('@') ? entered : entered + '@divineseeds.app';

  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (e) {
    console.error('Firebase sign-in failed:', e.code, e.message);
    const messages = {
      'auth/invalid-email': 'The username/email format is invalid.',
      'auth/user-not-found': 'No Firebase account matches this username. Check Authentication → Users.',
      'auth/wrong-password': 'The password is incorrect. Reset the password for this Firebase account and try again.',
      'auth/invalid-credential': 'The username or password is incorrect, or this account is not in the configured Firebase project.',
      'auth/too-many-requests': 'Too many attempts. Wait a while, then try again or reset the password.',
      'auth/operation-not-allowed': 'Email/password sign-in is disabled. Enable it in Firebase Authentication → Sign-in method.',
      'auth/network-request-failed': 'Network error. Check your internet connection and try again.',
      'auth/unauthorized-domain': 'This site domain is not authorized. Add the deployed domain in Firebase Authentication → Settings → Authorized domains.'
    };
    err.textContent = (messages[e.code] || ('Login failed: ' + (e.code || 'unknown error'))) +
      ' If this continues, check the browser console for the Firebase error code.';
  }
}
async function bio(){try{if(!window.PublicKeyCredential)throw 0;err.textContent='Fingerprint sign-in needs WebAuthn enrolment - see guide (Phase 2). Use password for now.'}catch(e){err.textContent='Biometrics not supported on this device.'}}
const add=(c,o)=>db.collection(c).add({...o,by:me.uid,byName:me.name,at:Date.now()});
const list=async(c,f)=>{let q=db.collection(c);if(f)q=q.where(...f);return(await q.get()).docs.map(d=>({id:d.id,...d.data()}))};
const notify=m=>add('notifications',{msg:m,to:MG});
function go(k){document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));side.classList.remove('open');
 ttl.textContent=document.querySelector(`aside a[data-k=${k}]`)?.textContent||'';V[k]()}
const set=h=>$('#main').innerHTML=h;
const V={
async dash(){ if(me.role=='student')return studentDash(me.uid); const s=(await db.doc('staff/'+me.uid).get()).data()||{};
 const at=await list('attendance',['uid','==',me.uid]);const ab=at.filter(a=>a.status=='Absent').length;
 set(`<div class="card hero"><img class="pic" src="${s.photo||''}"><div><h2>${me.name}</h2><p>${s.position||me.role} · ${s.department||''}<br>ID: ${s.staffId||''} · ${s.campus||''}</p></div></div>
 <div class="grid"><div class="card stat"><span>Basic Salary</span><b>${money(s.salary)}</b></div><div class="card stat"><span>Fines (₦1,000/absence)</span><b class="red">${money(ab*1000)}</b></div><div class="card stat"><span>Net Pay</span><b class="green">${money((s.salary||0)-ab*1000)}</b></div><div class="card stat"><span>Days Present</span><b>${at.length-ab}</b></div></div>
 <div class="card"><h3>Attendance Record</h3><table><tr><th>Date</th><th>Time</th><th>Status</th></tr>${at.map(a=>`<tr><td>${a.date}</td><td>${a.time||'-'}</td><td class="${a.status=='Present'?'green':'red'}">${a.status}</td></tr>`).join('')}</table></div>`)},
async news(){const aud=me.role=='student'?'students':'staff';const a=(await list('announcements',MG.includes(me.role)?null:['audience','==',aud])).sort((x,y)=>y.at-x.at);
 set(a.map(x=>`<div class="card"><b>${x.title}</b> <span class="tag" style="background:var(--acc)">${x.audience}</span><p>${x.body}</p><small>${x.byName} · ${new Date(x.at).toLocaleString()}</small></div>`).join('')||'<div class="card">No announcements yet.</div>')},
async attend(){const t=today(),id=t+'_'+me.uid;const ex=await db.doc('attendance/'+id).get();
 set(`<div class="card"><h3>Working-hours Attendance (Staff)</h3><p>Clock in before <b>08:00</b> to be Present. Later or no clock-in = Absent and a ₦1,000 fine.</p>
 ${ex.exists?`<p class="green">Recorded: ${ex.data().status} at ${ex.data().time}</p>`:`<button onclick="clock()">👆 Fingerprint Clock-In</button>`}</div>`)},
async scores(){const st=await list('students');set(`<div class="card"><h3>Enter Scores</h3><select id="sid">${st.map(s=>`<option value="${s.id}">${s.surname} ${s.firstName} (${s.class})</option>`).join('')}</select>
 <input id="sub" placeholder="Subject"><select id="tri"><option>1st Trimester</option><option>2nd Trimester</option><option>3rd Trimester</option></select>
 <input id="test" type="number" placeholder="Test score (40)"><input id="exam" type="number" placeholder="Exam score (60)"><button onclick="saveScore()">Submit</button></div>`)},
async pub(){const r=(await list('results')).filter(x=>!x.published);set(`<div class="card"><h3>Results awaiting validation</h3><table><tr><th>Student</th><th>Subject</th><th>Trimester</th><th>Total</th><th></th></tr>${r.map(x=>`<tr><td>${x.studentName}</td><td>${x.subject}</td><td>${x.trimester}</td><td>${x.test+x.exam}</td><td><button onclick="publish('${x.id}')">Validate</button></td></tr>`).join('')}</table></div>`)},
async mgmt(){const[s,t,n]=await Promise.all([list('students'),list('staff'),list('attendance',['date','==',today()])]);
 set(`<div class="grid"><div class="card stat"><span>Students</span><b>${s.length}</b></div><div class="card stat"><span>Staff</span><b>${t.length}</b></div><div class="card stat"><span>Staff present today</span><b class="green">${n.filter(x=>x.status=='Present').length}</b></div></div>
 <div class="card"><h3>Students</h3><table><tr><th>ID</th><th>Name</th><th>Class</th><th>Campus</th><th></th></tr>${s.map(x=>`<tr><td>${x.regNo}</td><td>${x.surname} ${x.firstName}</td><td>${x.class}</td><td>${x.campus}</td><td><button class="g" onclick="studentDash('${x.id}')">Open</button></td></tr>`).join('')}</table></div>`)},
reg(){set(`<div class="card"><h3>Student Registration</h3><div class="grid">${F([['surname','Surname'],['firstName','First name'],['middleName','Middle name'],['gender','Gender','Male,Female'],['dob','Date of birth','date'],['pob','Place of birth'],['nationality','Nationality'],['state','State of origin'],['lga','LGA'],['address','Residential address'],['phone','Phone'],['email','Email'],['indigene','Status','Indigene,Non-Indigene'],['level','Section','Creche,Nursery,Primary,High School'],['class','Class'],['session','Session (2026/2027)'],['campus','Campus','Ediam,Ikot Oso'],['boarding','Boarding?','Day,Boarding'],['father','Father name'],['fatherPhone','Father phone'],['mother','Mother name'],['motherPhone','Mother phone'],['guardianEmail','Parent email'],['emName','Emergency contact'],['emPhone','Emergency phone'],['blood','Blood group'],['genotype','Genotype'],['allergies','Allergies'],['feeDue','Total fees due (₦)','number']])}</div>
 <p>Passport photo:</p><input type="file" accept="image/*" capture="user" onchange="snap(this)"><img id="pv" class="pic"><br><button onclick="regStudent()">Register & Create Account</button><p id="rmsg"></p></div>`)},
async news_post(){},
async bread(){const d=(await list('bread_days')).sort((a,b)=>a.date>b.date?1:-1);let open=0;
 const rows=d.map(r=>{const av=open+r.produced,close=av-r.sold-r.damaged;const o={...r,open,av,close};open=close;return o});
 set(`<div class="card"><h3>Daily Bread Stock (carry-over is NOT a sale)</h3><table><tr><th>Date</th><th>Opening</th><th>Produced</th><th>Available</th><th>Sold</th><th>Damaged</th><th>Closing</th></tr>${rows.map(r=>`<tr><td>${r.date}</td><td>${r.open}</td><td>${r.produced}</td><td>${r.av}</td><td>${r.sold}</td><td>${r.damaged}</td><td><b>${r.close}</b></td></tr>`).join('')}</table></div>
 <div class="card"><h3>Add day</h3><input id="bd" type="date" value="${today()}"><input id="bp" type="number" placeholder="Produced"><input id="bs" type="number" placeholder="Sold"><input id="bx" type="number" placeholder="Damaged"><button onclick="saveBread(${open})">Save (blocks negative stock)</button></div>`)},
async notes(){const n=(await list('notifications')).sort((a,b)=>b.at-a.at).slice(0,50);set(n.map(x=>`<div class="card">${x.msg}<br><small>${new Date(x.at).toLocaleString()}</small></div>`).join('')||'<div class="card">Nothing yet.</div>')},
async staffreg(){set(`<div class="card"><h3>Add Staff / Role</h3>${F([['name','Full name'],['username','Username / Staff ID'],['password','Password'],['role','Role','teacher,staff,principal,accountant,confectionery,admin'],['position','Position'],['department','Department'],['campus','Campus','Ediam,Ikot Oso'],['salary','Basic salary','number']])}<button onclick="addStaff()">Create Staff</button><p id="rmsg"></p></div>`)},
async stat(){const s=await list('stationery');set(`<div class="card"><h3>Stationery</h3><table>${s.map(x=>`<tr><td>${x.item}</td><td>${money(x.price)}</td></tr>`).join('')}</table><input id="si" placeholder="Item"><input id="sp" type="number" placeholder="Price"><button onclick="add('stationery',{item:si.value,price:+sp.value}).then(()=>go('stat'))">Add</button></div>`)},
reset(){if(!TOP.includes(me.role))return;set(`<div class="card"><h3 class="red">Reset (Proprietor/Admin only)</h3><select id="rc"><option>announcements</option><option>results</option><option>attendance</option><option>fees</option><option>bread_days</option><option>notifications</option></select><button class="s" onclick="doReset()">Reset selected section</button></div>`)}};
V.news_post=null;
const _news=V.news;V.news=async function(){if(!MG.includes(me.role))return _news();await _news();$('#main').insertAdjacentHTML('afterbegin',`<div class="card"><h3>Post Announcement</h3><select id="aud"><option value="students">Students</option><option value="staff">Teachers & Staff</option></select><input id="at" placeholder="Title"><textarea id="ab" placeholder="Message"></textarea><button onclick="postNews()">Publish</button></div>`)};
V.news_=0;
function F(a){return a.map(([k,l,o])=>o&&o!='date'&&o!='number'?`<select id="f_${k}"><option value="">${l}</option>${o.split(',').map(x=>`<option>${x}</option>`).join('')}</select>`:`<input id="f_${k}" type="${o||'text'}" placeholder="${l}">`).join('')}
const G=()=>Object.fromEntries([...document.querySelectorAll('[id^=f_]')].map(e=>[e.id.slice(2),e.value]));
function snap(i){const f=i.files[0],im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d');x.filter='brightness(1.08) contrast(1.05) saturate(1.1)';const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,240,240);photo=c.toDataURL('image/jpeg',.8);$('#pv').src=photo};im.src=URL.createObjectURL(f)}
async function mkUser(username,pw,data){const sec=firebase.apps.find(a=>a.name=='sec')||firebase.initializeApp(CFG,'sec');
 const c=await sec.auth().createUserWithEmailAndPassword(username+'@divineseeds.app',pw);await sec.auth().signOut();await db.doc('users/'+c.user.uid).set(data);return c.user.uid}
async function regStudent(){const g=G();const n=(await list('students')).length+1,reg='DSIS/'+new Date().getFullYear()+'/'+String(n).padStart(4,'0');
 const uid=await mkUser(reg.replace(/\//g,'').toLowerCase(),'Seeds'+Math.floor(1000+Math.random()*9000),{role:'student',name:g.firstName+' '+g.surname});
 await db.doc('students/'+uid).set({...g,feeDue:+g.feeDue||0,regNo:reg,photo,status:'Active',registered:Date.now()});await notify('New student registered: '+g.firstName+' '+g.surname);
 rmsg.innerHTML=`Done. Username: <b>${reg.replace(/\//g,'').toLowerCase()}</b> (give the parent the temporary password from Firebase console or reset by email).`}
async function addStaff(){
  const g = G();
  if(!g.name || !g.username || !g.password || !g.role){
    rmsg.textContent = 'Enter name, username, password, and role.';
    return;
  }
  try {
    const uid = await mkUser(g.username.toLowerCase(), g.password, {role:g.role, name:g.name});
    delete g.password;
    await db.doc('staff/' + uid).set({...g, staffId:g.username, salary:+g.salary||0, photo});
    rmsg.textContent = 'Staff account created successfully.';
  } catch(e) {
    console.error('Create staff failed:', e.code, e.message);
    rmsg.textContent = 'Could not create staff: ' + (e.code || e.message || 'unknown error');
  }
}
async function clock(){const n=new Date(),hm=n.toTimeString().slice(0,5),st=hm<='08:00'?'Present':'Absent';
 await db.doc('attendance/'+today()+'_'+me.uid).set({uid:me.uid,name:me.name,date:today(),time:hm,status:st,fine:st=='Absent'?1000:0});
 await notify(`${me.name} marked ${st} at ${hm}`);go('attend')}
async function postNews(){await add('announcements',{audience:aud.value,title:at.value,body:ab.value});await notify('New announcement for '+aud.value+': '+at.value);go('news')}
async function saveScore(){const o=sid.options[sid.selectedIndex].text;await add('results',{studentId:sid.value,studentName:o,subject:sub.value,trimester:tri.value,test:+test.value,exam:+exam.value,published:false});alert('Submitted for validation')}
async function publish(id){await db.doc('results/'+id).update({published:true});await notify('Results validated');go('pub')}
async function saveBread(open){const p=+bp.value||0,s=+bs.value||0,x=+bx.value||0;if(open+p-s-x<0)return alert('Negative stock not allowed');await db.collection('bread_days').doc(bd.value).set({date:bd.value,produced:p,sold:s,damaged:x});go('bread')}
async function doReset(){if(!confirm('Delete ALL records in '+rc.value+'?'))return;const q=await db.collection(rc.value).get();const b=db.batch();q.docs.forEach(d=>b.delete(d.ref));await b.commit();alert('Reset done')}
async function studentDash(id){const[s,r,f,c]=await Promise.all([db.doc('students/'+id).get().then(d=>d.data()||{}),list('results',['studentId','==',id]),list('fees',['studentId','==',id]),list('comments',['studentId','==',id])]);
 const res=r.filter(x=>x.published),tot=res.map(x=>x.test+x.exam),paid=f.reduce((a,x)=>a+x.amount,0),due=s.feeDue||0,fit=paid>=due;
 set(`<div class="grid" style="grid-template-columns:minmax(260px,320px) 1fr;align-items:start"><div class="card" style="text-align:center"><img class="pic" style="width:170px;height:170px" src="${s.photo||''}"><h2>${(s.surname||'')+' '+(s.firstName||'')}</h2><p style="color:var(--mut)">ID: ${s.regNo||''} · ${s.class||''} · ${s.campus||''}</p>
 <div class="grid"><div class="stat"><b>${money(paid)}</b><span>Paid</span></div><div class="stat"><b>${money(Math.max(due-paid,0))}</b><span>Balance</span></div><div class="stat"><b class="${fit?'green':'red'}">${fit?'Fit':'Owing'}</b><span>Class status</span></div></div></div>
 <div><div class="card"><h3>Academic Results ${tot.length?`<small>(High ${Math.max(...tot)} · Low ${Math.min(...tot)})</small>`:''}</h3><table><tr><th>Subject</th><th>Trimester</th><th>Test</th><th>Exam</th><th>Total</th></tr>${res.map(x=>{const t=x.test+x.exam;return`<tr><td>${x.subject}</td><td>${x.trimester}</td><td>${x.test}</td><td>${x.exam}</td><td class="${t<50?'red':'green'}">${t}</td></tr>`}).join('')||'<tr><td>Results not yet released.</td></tr>'}</table></div>
 <div class="card"><h3>Payments</h3><table>${f.map(x=>`<tr><td>${x.type}</td><td>${x.trimester||''}</td><td>${money(x.amount)}</td><td><button class="g" onclick="receipt('${x.id}')">Receipt</button></td></tr>`).join('')}</table></div>
 <div class="card"><h3>Comments</h3>${c.map(x=>`<p><b>${x.byName}</b>: ${x.text}</p>`).join('')}<input id="cm" placeholder="Write a comment"><button onclick="add('comments',{studentId:'${id}',text:cm.value}).then(()=>studentDash('${id}'))">Post</button></div></div></div>`)}
async function receipt(id){const f=(await db.doc('fees/'+id).get()).data(),s=(await db.doc('students/'+f.studentId).get()).data();
 const w=open('');w.document.write(`<body style="font-family:Arial;padding:30px"><img src="${LOGO_URL}" width=80><img src="${s.photo}" width=90 style="float:right"><h2>Payment Receipt</h2><p>${s.surname} ${s.firstName} (${s.regNo})</p><p>${f.type} — <b>${money(f.amount)}</b></p><p>${new Date(f.at).toLocaleString()}</p><script>print()<\/script>`)}
</script></body></html>
